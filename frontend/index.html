<!doctype html>
<html lang="en">

    <script>
      (function() {
        // Prevent Uncaught TypeError when environments or polyfills attempt to set window.fetch
        try {
          let currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          const patchTarget = function(target) {
            try {
              const desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || desc.configurable) {
                Object.defineProperty(target, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(fn) {
                    currentFetch = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
                return true;
              }
            } catch (_) {}
            return false;
          };

          patchTarget(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            patchTarget(Window.prototype);
          }
        } catch (_) {}

        // Global safeguard against unhandled fetch property setter error
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('only a getter') !== -1) {
            event.preventDefault();
            return true;
          }
        });
      })();
    </script>

    <!-- Instant Preload of Critical Visual Assets (Zero pop-in & zero blank flash) -->
    <link rel="preload" href="/logo.png" as="image" fetchpriority="high" />
    <link rel="preload" href="/images/logo-badge.png" as="image" fetchpriority="high" />
    <link rel="preload" href="/images/hero-chef-backdrop.jpg" as="image" fetchpriority="high" />

    <!-- Google Fonts: Playfair Display + Plus Jakarta Sans with font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Inline Critical Shell Styles: Prevents Black Screen on Initial Load -->
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        background-color: #03160E !important;
        background: radial-gradient(ellipse at top, #0A3324 0%, #041A11 45%, #020B07 100%) no-repeat fixed !important;
        color: #FAF8F5;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #root {
        min-height: 100vh;
        width: 100%;
        background-color: transparent;
      }
      .ad-shell-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
        background: radial-gradient(circle at center, #073523 0%, #03160E 60%, #020B07 100%);
      }
      .ad-shell-logo-wrap {
        position: relative;
        width: 84px;
        height: 84px;
        margin-bottom: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ad-shell-glow {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.4) 0%, transparent 70%);
        animation: adPulse 2s ease-in-out infinite;
      }
      .ad-shell-img {
        width: 74px;
        height: 74px;
        object-fit: contain;
        border-radius: 50%;
        border: 2px solid rgba(245, 206, 104, 0.6);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        position: relative;
        z-index: 1;
      }
      .ad-shell-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #F5CE68;
        margin: 0 0 0.35rem 0;
        text-transform: uppercase;
      }
      .ad-shell-sub {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.22em;
        color: #A7F3D0;
        text-transform: uppercase;
        margin: 0 0 1.25rem 0;
        opacity: 0.85;
      }
      .ad-shell-bar {
        width: 130px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(212, 175, 55, 0.2);
        overflow: hidden;
        position: relative;
      }
      .ad-shell-bar-inner {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #D4AF37, #F5CE68, #10B981);
        animation: adBar 1.2s ease-in-out infinite alternate;
      }
      @keyframes adPulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.85; }
      }
      @keyframes adBar {
        0% { transform: translateX(-15%); }
        100% { transform: translateX(180%); }
      }
    </style>
