        try {

          const patchTarget = function(target) {
            try {
              const desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || desc.configurable) {
                Object.defineProperty(target, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(fn) {
                    currentFetch = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
                return true;
              }
            } catch (_) {}
            return false;
          };

          patchTarget(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            patchTarget(Window.prototype);
          }
        } catch (_) {}

        // Global safeguard against unhandled fetch property setter error
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('only a getter') !== -1) {
            event.preventDefault();
            return true;
          }
        });
      })();
